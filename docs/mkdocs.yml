site_name: OpenGarage Documentation
site_url: https://OpenGarage.github.io/OpenGarage-Firmware/
repo_url: https://github.com/OpenGarage/OpenGarage-Firmware

# Release maintenance: update the redirect and fallback-link targets in
# docs/manual/index.html and docs/api/index.html (relative to this config).
# These permanent /manual/ and /api/ links must target the latest released
# firmware. MkDocs copies them without a redirect plugin;
# their JavaScript preserves section anchors and query strings.

theme: readthedocs

nav:
  - 'Home': 'index.md'
  - 'FAQ': 'faq.md'
  - 'Firmware v1.2.6 <span class="nav-new-badge" aria-label="New">NEW</span>':
    - 'User Manual': '1.2.6/manual.md'
    - 'API Reference': '1.2.6/api.md'
  - 'Firmware v1.2.5':
    - 'User Manual': '1.2.5/manual.md'
    - 'API Reference': '1.2.5/api.md'
  - 'Guides':
    - 'Remote Access with OTC': 'guides/remote-access-otc.md'
    - 'Setting Up Email Notifications': 'guides/email-notifications.md'
    - 'DIY Security+ 3.0 Adapter': 'guides/diy-security-adapter.md'
    - 'Using OpenGarage with IFTTT': 'guides/using-opengarage-with-ifttt.md'
  - 'Archived':
    - 'Previous Manuals and API docs': 'archive.md'
extra_css:
  - custom.css
markdown_extensions:
  - attr_list
  - admonition
