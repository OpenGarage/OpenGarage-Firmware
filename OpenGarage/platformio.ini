; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
; src_dir is the project root; compile vendored libraries through LDF only.
build_src_filter = +<*> -<lib/>
extra_scripts = pre:run_prebuild.py
; Application file operations are sequential; two slots also tolerate a retained log reader.
; 1536-byte OTF staging saves 2560 heap bytes; full chunks avoid WebSockets packing below 1400 bytes.
build_flags = -DSPIFFS_MAX_OPEN_FILES=2 -DOG_SMTP_BOUNDED_ONLY -DOTF_RESPONSE_BUFFER_SIZE=1536
; Add -DSERIAL_DEBUG only for private diagnostic builds.
lib_ldf_mode = deep
lib_deps =
	bblanchon/ArduinoJson@7.1.0
	; PubSubClient 2.8 is vendored in lib/ with incoming retain-bit metadata.
	https://github.com/PaulStoffregen/OneWire/archive/refs/tags/v2.3.7.zip
	https://github.com/milesburton/Arduino-Temperature-Control-Library/archive/refs/tags/3.9.1.zip
	https://github.com/beegee-tokyo/DHTesp/archive/refs/tags/1.18.zip
	; OTF 0.2.7; pin the reviewed release commit.
	https://github.com/OpenThingsIO/OpenThings-Framework-Firmware-Library.git#7439002868a6b1c92fc140cdc2ee52095d7dd884
	; The secplus codec is bundled in garagelib; its source matches argilo/secplus c35de10b.
	; garagelib v0.1.3; pin the exact release commit.
	https://github.com/OpenGarage/garagelib.git#7a0105376f144880b337a2169b42c7f72d3b4f72
monitor_speed = 115200
board_build.flash_mode = dio
upload_speed = 460800
board_build.ldscript = eagle.flash.4m1m.ld
