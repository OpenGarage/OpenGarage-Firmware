; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
; src_dir is the project root; compile vendored libraries through LDF only.
build_src_filter = +<*> -<lib/>
extra_scripts = pre:run_prebuild.py
;build_flags = -DSERIAL_DEBUG
lib_ldf_mode = deep
lib_deps =
	bblanchon/ArduinoJson@7.1.0
	; PubSubClient 2.8 is vendored in lib/ with incoming retain-bit metadata.
	https://github.com/PaulStoffregen/OneWire/archive/refs/tags/v2.3.7.zip
	https://github.com/milesburton/Arduino-Temperature-Control-Library/archive/refs/tags/3.9.1.zip
	https://github.com/beegee-tokyo/DHTesp/archive/refs/tags/1.18.zip
	; Test candidate; OTF 0.2.6 awaits soak acceptance.
	https://github.com/OpenThingsIO/OpenThings-Framework-Firmware-Library.git#4b6070f31209c5c7bf6df080e4c0d1fbc3c4b547
	; The secplus codec is bundled in garagelib; its source matches argilo/secplus c35de10b.
	; v0.1.1 + tested Sec+1 blocked-beam status fix; pin the exact commit.
	https://github.com/OpenGarage/garagelib.git#be74c9c051e111fc3dc1c9e98c5f36cb839f4fee
monitor_speed = 115200
board_build.flash_mode = dio
upload_speed = 460800
board_build.ldscript = eagle.flash.4m1m.ld
